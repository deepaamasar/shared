[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-worker-shared"
version = "1.5.2"
description = "Shared library for ContextBuilder v1 Celery workers (storage, db session, contracts, telemetry)."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "fsspec>=2024.10.0",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
    # OTEL telemetry bootstrap (telemetry.py). Pinned to ONE version across the
    # whole platform (matches backend/requirements.txt) — the bootstrap imports
    # the logs SDK whose API shifted between minors; drift would silently disable
    # telemetry since init_telemetry is non-fatal.
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp==1.27.0",
    "opentelemetry-instrumentation-requests==0.48b0",
    "opentelemetry-instrumentation-celery==0.48b0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctx_worker_shared = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ac(id): ties a test to a spec acceptance criterion, e.g. @pytest.mark.ac(\"FINOPS-AC-2\")",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Minimal on purpose (Rung 1): syntax errors + pyflakes only — never block on
# legacy style. Widen deliberately, not by default.
select = ["E9", "F"]
