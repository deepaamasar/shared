[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-worker-shared"
version = "1.6.2"
description = "Shared library for ContextBuilder v1 Celery workers (storage, db session, contracts, telemetry)."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy<3.0,>=2.0",
    "psycopg2-binary<3.0,>=2.9",
    "fsspec>=2024.10.0",
    "requests<3.0,>=2.31",
    "python-dotenv<2.0,>=1.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp==1.27.0",
    "opentelemetry-instrumentation-requests==0.48b0",
    "opentelemetry-instrumentation-celery==0.48b0",
]

[tool.setuptools]
packages = ["ctx_worker_shared"]
